<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wonderful Jodi — Doctor Matrimony Platform</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 50%, #fecdd3 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #1f2937;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(244, 63, 94, 0.15);
      border-radius: 24px;
      padding: 48px 36px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px -15px rgba(225, 29, 72, 0.15);
    }
    .badge {
      display: inline-block;
      background: #ffe4e6;
      color: #e11d48;
      font-weight: 600;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      color: #881337;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    p {
      color: #4b5563;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .spinner-box {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #fecdd3;
      border-top-color: #e11d48;
      border-radius: 50%;
      animation: spin 1s infinite cubic-bezier(0.55, 0.15, 0.45, 0.85);
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .footer-note {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 18px;
    }
  </style>
  <script>
    // Automatic ping and reload when Node.js server is ready
    let attempts = 0;
    function checkServer() {
      attempts++;
      fetch('/api/health')
        .then(function(res) {
          if (res.ok) {
            window.location.reload();
          } else {
            setTimeout(checkServer, 2000);
          }
        })
        .catch(function() {
          if (attempts < 30) {
            setTimeout(checkServer, 2500);
          }
        });
    }
    setTimeout(checkServer, 1500);
  </script>
</head>
<body>
  <div class="card">
    <div class="badge">Wonderful Jodi Matrimony</div>
    <div class="spinner-box">
      <div class="spinner"></div>
    </div>
    <h1>Connecting to Platform...</h1>
    <p>The platform services are initializing. This page will connect automatically as soon as the application is ready.</p>
    <div class="footer-note">Wonderful Jodi Doctor Matrimony &copy; 2026</div>
  </div>
</body>
</html>
